<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Harbourline Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500&family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F8FA;--surface:#FFFFFF;--ink:#16181D;--ink2:#3A3F47;--muted:#6B7280;--faint:#9AA1AC;--line:#E6E8EC;--line2:#D3D7DD;--hover:#F2F4F6;--sel:#ECEFF3;
--amber:#8A5A00;--amber-bg:#FFF5DC;--red:#B42318;--red-bg:#FDEDEB;--ok:#2F6B45;--ok-bg:#EAF4EE;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "IBM Plex Sans","Noto Sans TC","Noto Sans SC","PingFang HK","Microsoft JhengHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:20px 12px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:20px;overflow:auto}
.brand{padding:0 10px;font-weight:600;font-size:16px;letter-spacing:-.01em}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.nav{display:flex;flex-direction:column;gap:1px}
.nb{display:flex;align-items:center;justify-content:space-between;gap:8px;background:none;border:0;padding:8px 10px;border-radius:7px;color:var(--ink2);cursor:pointer;text-align:left;width:100%}
.nb:hover{background:var(--hover)}
.nb[aria-current="page"]{background:var(--sel);color:var(--ink);font-weight:500}
.cnt{font-size:12px;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.cgroup{display:flex;align-items:center}
.cgroup .nb{flex:1}
.chev{background:none;border:0;border-radius:6px;width:30px;height:30px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.chev:hover{background:var(--hover)}
.chev svg{transition:transform .15s}
.chev[aria-expanded="false"] svg{transform:rotate(-90deg)}
.clist{margin:2px 0 6px 18px;padding-left:8px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:1px}
.clist button{background:none;border:0;text-align:left;padding:5px 8px;border-radius:6px;font-size:13.5px;color:var(--muted);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clist button:hover{background:var(--hover);color:var(--ink)}
.clist button[aria-current="page"]{color:var(--ink);background:var(--sel);font-weight:500}
.user{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--line)}
.av{width:34px;height:34px;border-radius:50%;background:var(--sel);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--ink2);flex:none}
.user b{display:block;font-weight:500;font-size:14px;line-height:1.3}
.user span{font-size:12.5px;color:var(--muted)}
main{padding:32px 44px 72px;max-width:1200px;width:100%}
h1{font-size:24px;font-weight:600;margin:0;letter-spacing:-.015em;line-height:1.3}
h2{font-size:15px;font-weight:600;margin:0 0 10px}
h3{font-size:13px;font-weight:500;color:var(--muted);margin:18px 0 8px}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:26px}
.back{background:none;border:0;padding:0;color:var(--muted);cursor:pointer;font-size:13.5px;margin-bottom:10px;display:inline-flex;gap:6px;align-items:center}
.back:hover{color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
.card+.card{margin-top:16px}
.cols{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:20px;align-items:start}
.stack>*+*{margin-top:16px}
.sec{margin-bottom:30px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.sec-h h2{margin:0}
.btn{border-radius:7px;padding:8px 14px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{background:#2B2F36}
.btn.sec2{background:var(--surface);color:var(--ink);border-color:var(--line2)}
.btn.sec2:hover{background:var(--hover)}
.btn.sm{padding:5px 11px;font-size:13.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.txt{background:none;border:0;padding:0;color:var(--ink2);cursor:pointer;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px;font-size:inherit}
.txt:hover{text-decoration-color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
label.f{display:block;font-size:13px;font-weight:500;color:var(--ink2);margin:0 0 6px}
textarea,select,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:7px;padding:9px 11px}
textarea{min-height:140px;resize:vertical;line-height:1.55}
:focus-visible{outline:2px solid #4A6FA5;outline-offset:2px}
.fld+.fld{margin-top:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13.5px;cursor:pointer;color:var(--ink2)}
.chip:hover{border-color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.grp{font-size:12.5px;color:var(--muted);margin:14px 0 6px}
.quote{border-left:2px solid var(--line2);padding:2px 0 2px 12px;color:var(--ink2);font-size:14px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:7px 12px;font-size:13.5px;color:var(--muted);cursor:pointer;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink);font-weight:500}
.msg{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px 16px;font-size:14.5px;line-height:1.65;max-height:420px;overflow:auto;margin:0;font-family:inherit}
.list{list-style:none;padding:0;margin:0}
.list li{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.list li:last-child{border-bottom:0}
.pill{font-size:12px;padding:1px 9px;border-radius:999px;white-space:nowrap;border:1px solid transparent;line-height:1.7;font-weight:500}
button.pill{cursor:pointer}
.p-on{background:var(--bg);color:var(--muted);border-color:var(--line)}
.p-ok{background:var(--ok-bg);color:var(--ok)}
.p-wait{background:var(--amber-bg);color:var(--amber)}
.p-late{background:var(--red-bg);color:var(--red)}
.p-n{background:var(--sel);color:var(--ink2)}
.chop{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;border:1.5px solid var(--red);color:var(--red);border-radius:4px;padding:2px 7px 3px;transform:rotate(-3deg);text-align:center;min-width:54px;line-height:1.1;flex:none}
.chop b{font-family:"Noto Serif TC",serif;font-size:16px;font-weight:700}
.chop span{font-size:11px;font-weight:600;margin-top:1px;white-space:nowrap}
.due{font-size:13.5px;color:var(--muted);white-space:nowrap}
.items{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.it:last-child{border-bottom:0}
.it:hover{background:var(--hover)}
.it .t1{font-weight:500;font-size:14.5px}
.it .t2{font-size:13px;color:var(--muted);margin-top:1px}
.it .r{display:flex;align-items:center;gap:12px}
.none{padding:18px 16px;color:var(--muted);font-size:14px;border:1px dashed var(--line2);border-radius:10px}
.steps{list-style:none;margin:0;padding:0}
.step{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;padding:7px 0}
.dot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:11.5px;color:var(--faint);background:var(--surface)}
.step.done .dot{background:var(--ink2);border-color:var(--ink2);color:#fff}
.step.cur .dot{border-color:var(--ink);color:var(--ink);border-width:2px;font-weight:600}
.step .lab{padding-top:1px;font-size:14.5px;color:var(--ink2)}
.step.done .lab{color:var(--muted)}
.step.cur .lab{font-weight:500;color:var(--ink)}
.act{margin-top:10px;padding:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;font-size:14px}
.act p{margin:0 0 10px;color:var(--ink2)}
.act .meta{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.scroll{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.t tr:last-child td{border-bottom:0}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--hover)}
.zh{color:var(--muted);font-size:13px}
.note{font-size:13px;color:var(--muted)}
.kv{display:grid;grid-template-columns:minmax(110px,40%) 1fr;gap:8px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.banner{background:var(--amber-bg);color:var(--amber);padding:10px 14px;border-radius:8px;font-size:13.5px;margin-bottom:20px}
.linkbox{background:var(--bg);border:1px dashed var(--line2);border-radius:7px;padding:8px 10px;font-size:13.5px;word-break:break-all;color:var(--ink2)}
.inv{font-size:14px}
.inv .ln{display:flex;justify-content:space-between;gap:10px;padding:5px 0}
.inv .tot{border-top:1px solid var(--line);margin-top:6px;padding-top:9px;font-weight:600}
.num{font-variant-numeric:tabular-nums}
.who{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink2)}
.mini-av{width:22px;height:22px;border-radius:50%;background:var(--sel);display:inline-grid;place-items:center;font-size:10px;font-weight:600;color:var(--ink2);flex:none}
.sel-inline{width:auto;padding:4px 8px;font-size:14px}
.ctabs{margin-bottom:24px;overflow-x:auto}
.ctabs button{white-space:nowrap;font-size:14px;padding:9px 14px}
.edbtn{background:none;border:0;border-bottom:1px dashed var(--line2);padding:0 1px;cursor:text;border-radius:0}
.edbtn:hover{border-bottom-color:var(--ink);color:var(--ink)}
.edbtn.note{font-size:13px}
.edin{font:inherit;font-size:14px;padding:2px 6px;border:1px solid var(--ink);border-radius:5px;width:auto;text-align:right;background:var(--surface);color:var(--ink)}
.log li{display:block;font-size:13px;color:var(--muted);padding:7px 0}
.log time{color:var(--ink2);margin-right:8px}
.narrow{max-width:720px}
.loader{padding:36px 8px;text-align:center}
.bar{height:3px;background:var(--line);border-radius:3px;overflow:hidden;max-width:260px;margin:0 auto 14px;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;width:35%;background:var(--ink);border-radius:3px;animation:slide 1s ease-in-out infinite}
@keyframes slide{0%{left:-35%}100%{left:100%}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%;opacity:.4}}
.loader p{margin:0;color:var(--ink2);font-size:14px}
.pbnav button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:6px 8px;font-size:14px;color:var(--ink2);cursor:pointer}
.pbnav button:hover{background:var(--hover)}
.pbnav button[aria-current="true"]{background:var(--sel);color:var(--ink);font-weight:500}
.filt{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.filt button{background:none;border:1px solid transparent;border-radius:7px;padding:5px 11px;font-size:13.5px;color:var(--muted);cursor:pointer}
.filt button:hover{color:var(--ink)}
.filt button[aria-pressed="true"]{background:var(--surface);border-color:var(--line2);color:var(--ink);font-weight:500}
.modal-bg{position:fixed;inset:0;background:rgba(22,24,29,.4);display:grid;place-items:center;padding:20px;z-index:20}
.modal{background:var(--surface);border-radius:12px;max-width:720px;width:100%;max-height:86vh;overflow:auto;padding:24px}
.doc{border:1px solid var(--line);border-radius:6px;padding:22px;background:var(--bg);font-size:14px;line-height:1.65}
.doc .dh{text-align:center;font-weight:600;margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:14px;z-index:30}
@media (max-width:900px){.app{grid-template-columns:1fr}.rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px;gap:10px}.user{margin-top:0;border-top:0;padding:4px 10px}.cols{grid-template-columns:1fr}main{padding:22px 16px 60px}.top{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">Harbourline Desk<small>Harbourline Corporate Services</small></div>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="user" aria-label="Signed in user"><div class="av" aria-hidden="true">KY</div><div><b>Karen Yip</b><span>Senior Company Secretary</span></div></div>
  </aside>
  <main id="main"></main>
</div>
<div id="modal"></div>
<script>
const TODAY=new Date(2026,8,24);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const FIRM={name:'Harbourline Corporate Services Limited',addr:'18/F, Harbourline House, 2 Pedder Lane, Central, Hong Kong'};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function addMonths(d,n){const x=new Date(d);const day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+n);const last=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();x.setDate(Math.min(day,last));return x}
function fmt(d,lang){if(!d)return'';return(!lang||lang==='en')?d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear():d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日'}
function shortD(d){return d.getDate()+' '+MON[d.getMonth()]}
function daysTo(d){return Math.round((d-TODAY)/864e5)}
function iso(s){const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])}
function parseDate(s){if(!s)return null;let m=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return new Date(+m[1],m[2]-1,+m[3]);
m=s.match(/(\d{4})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})/);if(m)return new Date(+m[1],m[2]-1,+m[3]);
m=s.match(/(\d{1,2})\s+([A-Za-z]{3,})\.?,?\s+(\d{4})/);if(m){const i=MON.findIndex(x=>m[2].toLowerCase().startsWith(x.toLowerCase()));if(i>=0)return new Date(+m[3],i,+m[1])}
m=s.match(/([A-Za-z]{3,})\s+(\d{1,2}),?\s+(\d{4})/);if(m){const i=MON.findIndex(x=>m[1].toLowerCase().startsWith(x.toLowerCase()));if(i>=0)return new Date(+m[3],i,+m[2])}return null}
function rid(){return Math.random().toString(36).slice(2,8).toUpperCase()}
function hkd(n){return 'HK$'+n.toLocaleString('en-HK')}

/* ---------- Requirement items (trilingual) ---------- */
const ITEMS={
fullName:{en:'Full name as shown on ID',tc:'全名（與身份證明文件相同）',sc:'全名（与身份证明文件相同）',syn:['full name','english name','name','全名','英文姓名','姓名']},
chiName:{en:'Chinese name (if any)',tc:'中文姓名（如有）',sc:'中文姓名（如有）',syn:['chinese name','中文姓名','中文名']},
idNo:{en:'HKID or passport number, with issuing country',tc:'香港身份證或護照號碼及簽發國家／地區',sc:'香港身份证或护照号码及签发国家／地区',syn:['hkid','passport no','passport','id number','身份證','身份证','護照','护照']},
resAddr:{en:'Residential address',tc:'住址',sc:'住址',syn:['residential address','home address','住址']},
corrAddr:{en:'Correspondence address (shown on the public register)',tc:'通訊地址（會載於公眾紀錄）',sc:'通讯地址（会载于公众记录）',syn:['correspondence address','通訊地址','通讯地址']},
contactInfo:{en:'Email and mobile number',tc:'電郵及手提電話號碼',sc:'电邮及手机号码',syn:['email and mobile','email','mobile','phone','電郵','电邮','電話','电话']},
effDate:{en:'Effective date',tc:'生效日期',sc:'生效日期',syn:['effective date','date of appointment','start date','effective','生效日期','生效']},
idCopy:{doc:1,en:'Copy of HKID or passport',tc:'香港身份證或護照副本',sc:'香港身份证或护照副本',file:['hkid','passport','id_']},
addrProof:{doc:1,en:'Address proof dated within the last 3 months',tc:'最近三個月內的住址證明',sc:'最近三个月内的住址证明',file:['address','utility','electricity','bill','statement']},
selfie:{doc:1,en:'Identity check with selfie (through the secure link)',tc:'自拍身份核實（經安全連結完成）',sc:'自拍身份核实（经安全链接完成）',file:['identity check','selfie']},
resignLetter:{doc:1,en:'Signed resignation letter',tc:'已簽署的辭職信',sc:'已签署的辞职信',file:['resign']},
lastDay:{en:'Last day in office',tc:'最後任職日期',sc:'最后任职日期',syn:['last day','cessation','最後任職','最后任职']},
replacement:{en:'Replacement director, if no individual director would remain',tc:'接任董事人選（如辭任後再無個人董事）',sc:'接任董事人选（如辞任后再无个人董事）',syn:['replacement','接任']},
changeDetail:{en:'What has changed (old and new details)',tc:'變更內容（新舊資料）',sc:'变更内容（新旧资料）',syn:['change','變更','变更']},
supportDoc:{doc:1,en:'Supporting document for the change',tc:'變更的證明文件',sc:'变更的证明文件',file:['passport','address','proof','certificate','deed']},
secDetails:{en:'New secretary: name, Hong Kong address and ID or company number',tc:'新公司秘書：姓名、香港地址及身份證明或公司編號',sc:'新公司秘书：姓名、香港地址及身份证明或公司编号',syn:['secretary','秘書','秘书']},
newAddr:{en:'New registered office address in Hong Kong',tc:'新的香港註冊辦事處地址',sc:'新的香港注册办事处地址',syn:['new address','new registered office','registered office','address','新地址','註冊辦事處','注册办事处']},
premises:{doc:1,en:'Tenancy agreement or landlord consent for the new address',tc:'新地址的租約或業主同意書',sc:'新地址的租约或业主同意书',file:['tenancy','lease','landlord']},
newName:{en:'Proposed new name (English and/or Chinese), with a backup',tc:'擬用新名稱（英文及／或中文）及後備名稱',sc:'拟用新名称（英文及／或中文）及备选名称',syn:['new name','proposed name','新名稱','新名称']},

function client(id){return S.clients.find(c=>c.id===id)}
function annualDue(key,c){
 if(key==='nar1'){if(!c.inc)return null;const i=iso(c.inc);let d=addDays(new Date(TODAY.getFullYear(),i.getMonth(),i.getDate()),42);if(d<TODAY)d=addDays(new Date(TODAY.getFullYear()+1,i.getMonth(),i.getDate()),42);return d}
 if(key==='agm'){if(!c.inc)return null;let fy=new Date(TODAY.getFullYear(),c.fye[0]-1,c.fye[1]);if(fy>TODAY)fy=new Date(TODAY.getFullYear()-1,c.fye[0]-1,c.fye[1]);let d=addMonths(fy,9);if(d<TODAY)d=addMonths(new Date(fy.getFullYear()+1,c.fye[0]-1,c.fye[1]),9);return d}
 if(key==='br')return c.br?iso(c.br):null;
 if(key==='kyc'){if(!c.kyc)return null;const y={High:1,Medium:2,Low:3}[c.risk]||2;const k=iso(c.kyc);return new Date(k.getFullYear()+y,k.getMonth(),k.getDate())}
 return null}
function dueFor(pbId,c,eff){const dl=PB[pbId].deadline;if(!dl)return null;if(dl.kind==='event')return addDays(eff||TODAY,dl.days);return annualDue(dl.key,c)}
function reqs(pbId,pid){const pb=PB[pbId];const p=pid&&S.people[pid];let need=[...pb.needs],on=[];if(pb.person==='new'&&p&&p.kyc){on=need.filter(k=>PERSONAL.includes(k));need=need.filter(k=>!PERSONAL.includes(k))}return{need,on}}
function deadlines(cid){const rows=[];S.clients.filter(c=>c.status==='Active'&&(!cid||c.id===cid)).forEach(c=>{[['annualReturn','nar1'],['agm','agm'],['brRenewal','br'],['kycReview','kyc']].forEach(([pb,k])=>{if(k==='agm'&&c.op==='Dormant')return;const d=annualDue(k,c);if(d)rows.push({c,pb,d,task:S.tasks.find(t=>t.client===c.id&&t.pb===pb&&!done(t))})})});return rows.sort((a,b)=>a.d-b.d)}

function linkFor(code){return 'https://portal.harbourline.hk/r/'+code}
function requestMsg(ids,c,lang,persons,code,invNo,days,total){const T=TX[lang],co=c.name[lang];const firm=ids.length===1&&PB[ids[0]].mode==='firm';
 let s=T.hi(c.contact[lang])+'\n\n'+T.intro(firm?PB[ids[0]].phrase[lang]:T.join(ids.map(i=>PB[i].phrase[lang])),co,firm)+'\n\n';let allOn=[];
 ids.forEach(id=>{const {need,on}=reqs(id,persons[id]);allOn=allOn.concat(on.filter(k=>!allOn.includes(k)));if(ids.length>1)s+=T.head(PB[id].name[lang])+'\n';s+=need.map((k,i)=>(i+1)+'. '+ITEMS[k][lang]).join('\n')+'\n\n'});
 if(allOn.length)s+=T.on(allOn.map(k=>ITEMS[k][lang]).join(T.sep))+'\n\n';
 s+=T.link(linkFor(code))+'\n\n';
 const fee=total!=null?total:ids.reduce((a,i)=>a+PB[i].fee,0);if(fee&&invNo)s+=(days?T.invc(invNo,hkd(fee),days):T.inv(invNo,hkd(fee)))+'\n\n';
 const ev=ids.map(i=>PB[i].deadline).find(d=>d&&d.kind==='event');
 if(ev)s+=T.ev(ev.days)+'\n\n';else{const id=ids.find(i=>PB[i].deadline&&PB[i].deadline.kind==='annual');if(id){const d=dueFor(id,c);if(d){let r=addDays(d,-10);if(r<addDays(TODAY,3))r=addDays(TODAY,3);s+=(PB[id].deadline.key==='nar1'?T.cr:T.other)(fmt(d,lang),fmt(r,lang))+'\n\n'}}}
 return s+T.bye}

 return T.hi(c.contact[m.lang])+'\n\n'+T.chase(pb.phrase[m.lang],c.name[m.lang])+'\n\n'+w.map((k,i)=>(i+1)+'. '+ITEMS[k][m.lang]).join('\n')+'\n\n'+T.same(linkFor(m.code))+'\n\n'+T.bye}

/* ---------- Intent and extraction ---------- */
function suggestAll(text){if(!text||!text.trim())return[];const t=text.toLowerCase();const sc=[];for(const id in PB){const s=PB[id].kw.reduce((a,k)=>a+(t.includes(k.toLowerCase())?k.length:0),0);if(s>0)sc.push([id,s])}sc.sort((a,b)=>b[1]-a[1]);return sc.slice(0,3).map(x=>x[0])}
function detectPerson(text,cid){const c=client(cid);if(!text)return'';for(const pid of c.people){const p=S.people[pid];if(text.includes(p.zh)||text.toLowerCase().includes(p.name.toLowerCase()))return pid}return''}
function extract(text,m){const needed=Object.keys(m.items).filter(k=>m.items[k]!=='on');const found={};const lines=text.split(/\n+/).map(x=>x.trim()).filter(Boolean);
 const synList=[];needed.forEach(k=>{(ITEMS[k].syn||[]).forEach(s=>synList.push([s.toLowerCase(),k]))});synList.sort((a,b)=>b[0].length-a[0].length);
 const free=[];
 lines.forEach(line=>{const att=line.match(/^\[(?:attachment|附件)\s*[:：]\s*([^\]]+)\]/i);if(att){const f=att[1].trim(),fl=f.toLowerCase();const k=needed.find(k=>ITEMS[k].doc&&(ITEMS[k].file||[]).some(w=>fl.includes(w))&&!found[k])||needed.find(k=>ITEMS[k].doc&&(ITEMS[k].file||[]).some(w=>fl.includes(w)));if(k)found[k]=found[k]?found[k]+', '+f:f;return}
  if(/identity check completed/i.test(line)&&needed.includes('selfie')){found.selfie='Completed through secure link';return}
  const kv=line.match(/^([^:：]{1,40})[:：]\s*(.+)$/);if(kv){const key=kv[1].toLowerCase();const hit=synList.find(([s,k])=>key.includes(s)&&!found[k]);if(hit){found[hit[1]]=kv[2].trim();return}}
  free.push(line)});
 needed.forEach(k=>{if(found[k]||ITEMS[k].doc)return;const s=(ITEMS[k].syn||[]).map(x=>x.toLowerCase());const l=free.find(l=>s.some(x=>l.toLowerCase().includes(x)));if(l)found[k]=l});
 return found}

function newInvoice(cid,ids,days,prices,custom){const lines=ids.filter(i=>PB[i].fee).map(i=>[PB[i].name.en,prices&&prices[i]!=null?prices[i]:PB[i].fee]);if(!lines.length)return null;let no;if(!custom||custom===autoNo()){no=autoNo();S.invSeq++}else no=custom;S.invoices[no]={no,client:cid,lines,amount:lines.reduce((a,l)=>a+l[1],0),status:'unpaid',issued:TODAY,checked:'09:45',days:days||0,due:days?addDays(TODAY,days):null,reminders:[]};return S.invoices[no]}
function newTask(pbId,cid,pid,lang,code,inv,step){const {need,on}=reqs(pbId,pid);const items={};on.forEach(k=>items[k]='on');need.forEach(k=>items[k]='wait');
 const m={assignee:client(cid).staff||ME,id:'T-'+(++S.seq),pb:pbId,client:cid,person:pid||'',lang,code,inv:inv||null,step:step||0,items,data:{},docs:[],log:[],eff:null,out:null};S.tasks.unshift(m);return m}
function flowOf(t){const f=PB[t.pb].flow;return t.credit?f.filter(s=>s[0]!=='pay'):f}
function done(t){return t.step>=flowOf(t).length}
function waiting(t){return Object.keys(t.items).filter(k=>t.items[k]==='wait')}
function state(t){if(done(t))return'done';const k=flowOf(t)[t.step][0];if(k==='pay')return'pay';if(k==='collect'&&waiting(t).length)return'client';return'me'}
function tDue(t){return dueFor(t.pb,client(t.client),t.eff)}
function logT(t,x){t.log.unshift({d:shortD(TODAY),t:x})}

/* ---------- UI helpers ---------- */
const $m=document.getElementById('modal');
function dueHtml(d){if(!d)return'<span class="due">No fixed deadline</span>';const n=daysTo(d);if(n<=30)return'<span class="chop" title="'+(n<0?'Overdue since ':'Due ')+fmt(d)+'"><b>'+(n<0?'逾':'限')+'</b><span>'+(n<0?'Overdue':shortD(d))+'</span></span>';return'<span class="due">Due '+shortD(d)+'</span>'}
function toast(t){const e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function copyText(t){const ok=()=>toast('Copied. Paste it into WeChat or email.');const fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){toast('Select the text and copy it manually.')}a.remove()};try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}}
function modal(title,html){$m.innerHTML='<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="top" style="margin-bottom:16px"><h2 style="margin:0">'+esc(title)+'</h2><button class="btn sec2 sm" onclick="closeModal()">Close</button></div>'+html+'</div></div>';$m.querySelector('.modal button').focus()}
function closeModal(){$m.innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

function langTabs(cur,fn){return '<div class="tabs" role="tablist">'+LANGS.map(([k,l])=>'<button role="tab" aria-selected="'+(k===cur)+'" onclick="'+fn+'(\''+k+'\')">'+l+'</button>').join('')+'</div>'}
function taskRow(t,sub){const c=client(t.client),pb=PB[t.pb];const st=state(t);const pill={me:'',client:'<span class="pill p-wait">Waiting on client</span>',pay:'<span class="pill p-wait">Awaiting payment</span>',done:'<span class="pill p-ok">Done</span>'}[st];
 return '<button class="it" onclick="openTask(\''+t.id+'\')"><div><div class="t1">'+esc(pb.name.en)+'</div><div class="t2">'+esc(sub==='client'?(done(t)?'Completed':'Next: '+flowOf(t)[t.step][1]):c.name.en+(done(t)?'':' \u00b7 Next: '+flowOf(t)[t.step][1]))+'</div></div><div class="r">'+pill+(mine(t)?'':'<span title="Assigned to '+USERS[t.assignee].name+'">'+userHtml(t.assignee,1)+'</span>')+(done(t)?'':dueHtml(tDue(t)))+'</div></button>'}

 const od=Object.values(S.invoices).filter(i=>invState(i)==='overdue').length;h+='<button class="nb" '+cur(v==='invoices')+' onclick="go(\'invoices\')">Invoices'+(od?'<span class="cnt" style="color:var(--red)">'+od+' overdue</span>':'')+'</button>';

function confirmExtract(){const m=M();let n=0;document.querySelectorAll('[data-ex]').forEach(inp=>{const k=inp.dataset.ex;if(inp.value.trim()){m.data[k]=inp.value.trim();m.items[k]='rec';n++}});
 if(m.data.effDate){const e=parseDate(m.data.effDate);if(e)m.eff=e}if(m.data.lastDay&&!m.eff){const e=parseDate(m.data.lastDay);if(e)m.eff=e}
 m.pending=null;m.replyText='';logT(m,'Client reply processed: '+n+' item'+(n===1?'':'s')+' received');render();toast(n+' item'+(n===1?'':'s')+' added to the task')}
function showChase(){const m=M();m.out={kind:'chase',title:'Chase message',text:chaseMsg(m)};render()}
function invState(i){if(i.status==='paid')return'paid';if(!i.days)return'upfront';return daysTo(i.due)<0?'overdue':'due'}
function invLabel(i){const st=invState(i);if(st==='paid')return'<span class="pill p-ok">Paid '+(i.paidOn||'')+'</span>';if(st==='upfront')return'<span class="pill p-wait">Due before work starts</span>';const n=daysTo(i.due);return st==='overdue'?'<span class="pill p-late">Overdue '+(-n)+' day'+(n===-1?'':'s')+'</span>':'<span class="pill p-n">Due in '+n+' day'+(n===1?'':'s')+'</span>'}
function invFor(i){return i.lines.map(l=>l[0]).join(', ')}
function remindMsg(i,lang){const c=client(i.client),T=TX[lang];const bc=billingContact(c);return T.hi(bc&&bc.sal?bc.sal[lang]:c.contact[lang])+'\n\n'+T.remind(i.no,hkd(i.amount),fmt(i.issued,lang),fmt(i.due,lang))+'\n\n'+T.bye}
function remind(no,lang){const i=S.invoices[no];const _bc=billingContact(client(i.client));lang=lang||(_bc?_bc.lang:client(i.client).lang);window._rno=no;window._rmsg=remindMsg(i,lang);const bc=billingContact(client(i.client));modal('Payment reminder: '+no,(bc?'<p class="note" style="margin:-6px 0 12px">To '+esc(bc.name)+', '+esc(bc.ch)+'</p>':'')+langTabs(lang,'remindLang')+'<pre class="msg">'+esc(window._rmsg)+'</pre>'+(i.reminders.length?'<p class="note">Previous reminders: '+i.reminders.join(', ')+'</p>':'')+'<div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" onclick="logReminder()">Copy and log reminder</button></div>')}
function remindLang(l){remind(window._rno,l)}
function logReminder(){const i=S.invoices[window._rno];copyText(window._rmsg);i.reminders.push(shortD(TODAY));S.tasks.filter(t=>t.inv===i.no).forEach(t=>logT(t,'Payment reminder sent for '+i.no));closeModal();render()}
function markPaid(no,via){const inv=S.invoices[no];inv.status='paid';inv.paidVia=via;inv.paidOn=shortD(TODAY);S.tasks.filter(t=>t.inv===no).forEach(t=>{logT(t,via==='manual'?'Payment for '+no+' marked received manually':'Payment matched in '+via+': '+hkd(inv.amount)+' for '+no);if(flowOf(t)[t.step][0]==='pay')t.step++})}
function checkBank(no,bid){const btn=document.getElementById(bid||'bankbtn');if(btn){btn.disabled=true;btn.textContent='Checking Airwallex and HSBC\u2026'}setTimeout(()=>{markPaid(no,Math.random()<.5?'Airwallex':'HSBC');render();toast('Payment found and matched')},1400)}
function doStep(){const m=M(),pb=PB[m.pb];if(done(m))return;const [k,label]=flowOf(m)[m.step];const c=client(m.client);
 if(k==='collect'&&waiting(m).length)return;
 if(k==='kyc'){const names=m.person?S.people[m.person].name:(m.data.fullName||m.data.founders||m.data.scList||'the individuals involved');logT(m,'Screened '+names+' against sanctions and PEP lists: no matches')}
 else if(k==='generate'){m.docs=pb.docs.slice();logT(m,m.docs.length+' documents prepared from the registers and client details')}
 else if(k==='sign')logT(m,'Signature pack sent through the secure link; signed copies received');
 else if(k==='file'){m.filed='e-filing ref '+rid()+rid().slice(0,2);logT(m,'Filed with the Companies Registry, '+m.filed)}
 else if(k==='register'){applyRegister(m);logT(m,label+': done')}
 else if(k==='confirm'){m.out={kind:'done',title:'Confirmation to client',text:doneMsg(m)};logT(m,'Confirmation drafted')}
 else if(k==='name')logT(m,'No identical name found on the Companies Registry index');
 else if(k==='search')logT(m,'Company search obtained and compared with handed-over registers');
 else if(k==='check'){const left=c.directors.filter(x=>x!==m.person).length;logT(m,left?'Board check passed: '+left+' individual director'+(left>1?'s':'')+' will remain':'Board check: no individual director would remain, so a replacement is required')}
 else logT(m,label+': done');
 m.step++;if(done(m)){logT(m,'Task complete');toast('Task complete')}render()}
function btnLabel(k){return{collect:'Continue',kyc:'Run screening',generate:'Generate documents',sign:'Send for e-signature',file:'Mark as filed',register:'Update records',confirm:'Draft confirmation',name:'Check name',search:'Run company search',check:'Run board check'}[k]||'Mark done'}
function setMOut(l){const m=M();m.lang=l;if(m.out)m.out.text=m.out.kind==='chase'?chaseMsg(m):doneMsg(m);render()}
function previewDoc(i){const m=M(),pb=PB[m.pb],c=client(m.client);const [type,name]=m.docs[i];let b='';
 const head='<div class="dh">'+esc(c.name.en)+'<br>'+esc(c.name.tc)+(c.cr?'<br><span class="note">Company number '+esc(c.cr)+'</span>':'')+'</div>';
 if(type==='res'){const dirs=c.directors.map(p=>S.people[p].name);b=head+'<p><strong>'+esc(name.replace(/:.*/,''))+'</strong> passed in writing in accordance with the Companies Ordinance (Cap. 622) and the articles of association of the Company.</p><p>IT IS RESOLVED:</p><p>'+esc(pb.res?pb.res(m):'')+'</p><p>THAT any director or the company secretary be authorised to sign and file all documents required to give effect to this resolution.</p><p style="margin-top:28px">'+(dirs.length?dirs.map(n=>'______________________<br>'+esc(n)).join('<br><br>'):'______________________<br>Director')+'</p><p class="note">Dated: ______________</p>'}
 else if(type==='form'){const rows=Object.keys(m.data).map(k=>'<tr><td>'+esc(ITEMS[k]?ITEMS[k].en:k)+'</td><td>'+esc(m.data[k])+'</td></tr>').join('');b=head+'<p><strong>'+esc(name)+'</strong></p><div class="scroll"><table class="t"><tbody><tr><td>Company</td><td>'+esc(c.name.en)+'</td></tr>'+(m.person?'<tr><td>Officer</td><td>'+esc(S.people[m.person].name+' '+S.people[m.person].zh)+'</td></tr>':'')+rows+'<tr><td>Presentor</td><td>'+esc(FIRM.name)+'</td></tr></tbody></table></div><p class="note">Data prepared for filing. The final form is produced in the Companies Registry\u2019s specified format.</p>'}
 else if(type==='reg'){const list=c.directors.map(p=>S.people[p]);b=head+'<p><strong>Register of directors</strong></p><div class="scroll"><table class="t"><thead><tr><th>Name</th><th>Chinese name</th><th>Status</th></tr></thead><tbody>'+list.map(p=>'<tr><td>'+esc(p.name)+'</td><td>'+esc(p.zh)+'</td><td>Current</td></tr>').join('')+'</tbody></table></div><p class="note">'+(m.step>flowOf(m).findIndex(s=>s[0]==='register')?'Reflects this matter.':'Updates when the register step is completed.')+'</p>'}
 else if(type==='letter'){b='<pre class="msg">'+esc(doneMsg(m))+'</pre>'}
 else{b=head+'<p><strong>'+esc(name)+'</strong></p><ul>'+(pb.notes.map(n=>'<li>'+esc(n)+'</li>').join(''))+'</ul><p class="note">Checklist content comes from the playbook and is editable by your team.</p>'}
 modal(name,'<div class="doc">'+b+'</div>')}

function vTask(){const m=M();if(!m)return vTasks();const pb=PB[m.pb],c=client(m.client);const fin=done(m);const w=waiting(m);const inv=m.inv&&S.invoices[m.inv];
 let h='<button class="back" onclick="openClient(\''+c.id+'\')">'+esc(c.name.en)+'</button><div class="top"><div><h1>'+esc(pb.name.en)+'</h1><p class="sub">'+m.id+(m.person?' \u00b7 '+esc(S.people[m.person].name):'')+(fin?' \u00b7 Completed':'')+'</p><div class="row" style="margin-top:8px"><label class="note" for="asg">Assigned to</label><select id="asg" class="sel-inline" onchange="reassign(this.value)">'+Object.keys(USERS).map(u=>'<option value="'+u+'"'+(u===m.assignee?' selected':'')+'>'+USERS[u].name+'</option>').join('')+'</select></div></div>'+(fin?'':dueHtml(tDue(m)))+'</div>';
 if(pb.deadline&&pb.deadline.kind==='event'&&!m.eff&&!fin)h+='<p class="note" style="margin:-14px 0 20px">Deadline assumes the change takes effect today. It updates once the effective date is confirmed.</p>';
 h+='<div class="cols"><div class="stack"><div class="card"><h2>Steps</h2><ol class="steps">';
 flowOf(m).forEach(([k,label],i)=>{const st=i<m.step?'done':i===m.step?'cur':'';h+='<li class="step '+st+'"><span class="dot" aria-hidden="true">'+(i<m.step?'\u2713':i+1)+'</span><div><div class="lab">'+esc(label)+'</div>';
  if(i===m.step){h+='<div class="act">';
   if(k==='pay'){h+='<p>Waiting for '+hkd(inv.amount)+' against '+inv.no+'. Airwallex and HSBC are checked every 15 minutes, matching on invoice number and amount.</p><div class="row"><button class="btn sm" id="bankbtn" onclick="checkBank(\''+inv.no+'\')">Check bank now</button><button class="txt note" onclick="markPaid(\''+inv.no+'\',\'manual\');render()">Mark paid manually</button></div><p class="meta">Last checked 09:45 \u00b7 not yet received</p>'}
   else if(k==='collect'){h+=w.length?'<p>Waiting on the client for '+w.length+' item'+(w.length>1?'s':'')+'. Paste their reply on the right, or tick items as they arrive.</p><div class="row"><button class="btn sec2 sm" onclick="showChase()">Draft a chase message</button></div>':'<p>Everything is in.</p><button class="btn sm" onclick="doStep()">Continue</button>'}
   else h+='<button class="btn sm" onclick="doStep()">'+btnLabel(k)+'</button>';
   h+='</div>'}
  h+='</div></li>'});
 h+='</ol></div>';
 if(m.out)h+='<div class="card"><div class="sec-h"><h2>'+esc(m.out.title)+'</h2><button class="txt note" onclick="M().out=null;render()">Dismiss</button></div>'+langTabs(m.lang,'setMOut')+'<pre class="msg">'+esc(m.out.text)+'</pre><div class="row" style="margin-top:12px"><button class="btn sec2 sm" onclick="copyText(M().out.text)">Copy message</button></div></div>';
 h+='<div class="card"><h2>Activity</h2><ul class="list log">'+m.log.map(l=>'<li><time>'+esc(l.d)+'</time>'+esc(l.t)+'</li>').join('')+'</ul>'+(m.source?'<h3>Original message</h3><p class="quote" style="-webkit-line-clamp:unset">'+esc(m.source)+'</p>':'')+'</div></div><div class="stack">';
 if(!fin&&w.length){h+='<div class="card"><h2>Client reply</h2>';if(m.pending){h+='<p class="note" style="margin:0 0 10px">Check what was picked up, edit if needed, then confirm.</p>'+Object.keys(m.pending).map(k=>'<div class="fld" style="margin-top:10px"><label class="f" for="ex_'+k+'">'+esc(ITEMS[k].en)+'</label><input type="text" id="ex_'+k+'" data-ex="'+k+'" value="'+esc(m.pending[k])+'"></div>').join('')+'<div class="row" style="margin-top:14px"><button class="btn sm" onclick="confirmExtract()">Confirm details</button><button class="txt note" onclick="M().pending=null;render()">Discard</button></div>'}
  else h+='<textarea id="reply" placeholder="Paste the client\u2019s reply, including attachment names" style="min-height:110px">'+esc(m.replyText||'')+'</textarea><div class="row" style="margin-top:10px;justify-content:space-between"><button class="txt note" onclick="useSample()">Use a sample reply</button><button class="btn sm" onclick="runExtract()">Extract details</button></div>';
  h+='</div>'}
 h+='<div class="card"><h2>Checklist</h2><ul class="list">'+Object.keys(m.items).map(k=>{const s=m.items[k];return '<li><span>'+esc(ITEMS[k].en)+(m.data[k]?'<div class="zh">'+esc(m.data[k])+'</div>':'')+'</span>'+(s==='on'?'<span class="pill p-on">On file</span>':'<button class="pill '+(s==='rec'?'p-ok':'p-wait')+'" onclick="toggleItem(\''+k+'\')" title="Click to change">'+(s==='rec'?'Received':'Waiting')+'</button>')+'</li>'}).join('')+'</ul></div>';
 if(inv)h+='<div class="card"><div class="sec-h"><h2>Invoice</h2>'+invLabel(inv)+'</div><div class="inv">'+inv.lines.map(l=>'<div class="ln"><span>'+esc(l[0])+'</span><span class="num">'+hkd(l[1])+'</span></div>').join('')+'<div class="ln tot"><span>'+inv.no+'</span><span class="num">'+hkd(inv.amount)+'</span></div></div>'+(inv.status==='paid'?'<p class="note" style="margin:8px 0 0">'+(inv.paidVia==='manual'?'Marked paid manually':'Matched in '+inv.paidVia)+' on '+inv.paidOn+'</p>':inv.days?'<p class="note" style="margin:8px 0 10px">'+inv.days+'-day terms \u00b7 issued '+fmt(inv.issued)+' \u00b7 due '+fmt(inv.due)+(inv.reminders.length?' \u00b7 reminded '+inv.reminders.join(', '):'')+'</p><div class="row"><button class="btn sec2 sm" id="bk_'+inv.no+'" onclick="checkBank(\''+inv.no+'\',\'bk_'+inv.no+'\')">Check bank now</button><button class="btn sec2 sm" onclick="remind(\''+inv.no+'\')">Send reminder</button></div>':'')+'</div>';
 h+='<div class="card"><h2>Documents</h2>'+(m.docs.length?'<ul class="list">'+m.docs.map((d,i)=>'<li><span>'+esc(d[1])+'</span><button class="btn sec2 sm" onclick="previewDoc('+i+')">Preview</button></li>').join('')+'</ul>':'<ul class="list">'+pb.docs.map(d=>'<li><span style="color:var(--muted)">'+esc(d[1])+'</span></li>').join('')+'</ul><p class="note" style="margin:8px 0 0">Generated once work starts.</p>')+'</div></div></div>';
 return h}

/* ---------- Playbooks ---------- */
function vPlaybooks(){const pb=PB[S.pbOpen];let h='<div class="top"><div><h1>Playbooks</h1><p class="sub">Requirements, steps, documents and messages for each request type.</p></div></div><div class="banner">For company secretary review. Deadlines and requirements reflect the Companies Ordinance (Cap. 622) as generally applied to private companies; confirm each against current Companies Registry guidance.</div><div class="cols" style="grid-template-columns:minmax(0,3fr) minmax(0,9fr)"><nav class="card pbnav" aria-label="Playbooks" style="padding:12px">';
 CATS.forEach((cat,ci)=>{h+='<div class="grp" style="margin-top:'+(ci?'14px':'2px')+'">'+cat+'</div>'+Object.keys(PB).filter(k=>PB[k].cat===cat).map(k=>'<button aria-current="'+(k===S.pbOpen)+'" onclick="S.pbOpen=\''+k+'\';render()">'+esc(PB[k].name.en)+'</button>').join('')});
 h+='</nav><section class="card"><h2 style="font-size:19px;margin-bottom:2px">'+esc(pb.name.en)+'</h2><p class="zh" style="margin:0 0 18px">'+esc(pb.name.tc)+' \u00b7 '+esc(pb.name.sc)+'</p>';
 h+='<dl class="kv"><dt>Forms</dt><dd>'+esc(pb.form)+'</dd><dt>Deadline</dt><dd>'+esc(pb.deadline?pb.deadline.rule:'No statutory deadline')+'</dd><dt>Started by</dt><dd>'+(pb.mode==='firm'?'Us, from the deadline calendar':'A client request')+'</dd><dt>Fee</dt><dd>'+(pb.fee?hkd(pb.fee)+', invoiced with the request':'No charge')+'</dd></dl>';
 h+='<h3>What we ask the client for</h3><div class="scroll"><table class="t"><thead><tr><th>English</th><th>繁體中文</th><th>简体中文</th></tr></thead><tbody>'+pb.needs.map(k=>'<tr><td>'+esc(ITEMS[k].en)+(pb.person==='new'&&PERSONAL.includes(k)?'<div class="zh">Skipped if already on file</div>':'')+'</td><td>'+esc(ITEMS[k].tc)+'</td><td>'+esc(ITEMS[k].sc)+'</td></tr>').join('')+'</tbody></table></div>';
 h+='<h3>Steps</h3><ol style="margin:0;padding-left:20px">'+pb.flow.map(s=>'<li>'+esc(s[1])+'</li>').join('')+'</ol>'+(pb.fee?'<p class="note" style="margin:8px 0 0">For clients on credit terms, work starts without waiting for payment, and the invoice is tracked separately.</p>':'');
 h+='<h3>Documents</h3><ul style="margin:0;padding-left:20px">'+pb.docs.map(d=>'<li>'+esc(d[1])+'</li>').join('')+'</ul>';
 h+='<h3>Compliance notes</h3><ul style="margin:0;padding-left:20px">'+pb.notes.map(n=>'<li>'+esc(n)+'</li>').join('')+'</ul></section></div>';
 return h}

render();
</script>
